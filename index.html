function game(){let r=state.rounds?.[state.round];if(!r)return '<div class="notice">Создайте раунд в редакторе.</div>';let q=activeQ();if(state.active&&!q){state.active=null;state.timerEnd=null;}
let controls='<div class="flex hostonly"><label class="field">Раунд <select onchange="setRound(+this.value)">'+state.rounds.map((x,i)=>'<option value="'+i+'" '+(i===state.round?'selected':'')+'>'+esc(x.name)+'</option>').join('')+'</select></label><button class="btn" onclick="resetRound()">↻ Сбросить вопросы</button></div>';
let secretUI=q?.special==='secret'&&state.phase==='question'?'<div class="hostonly"><p>🎁 Выбравший вопрос передаёт его другому игроку:</p><div class="flex" style="justify-content:center">'+state.players.map((p,i)=>'<button class="btn small" onclick="assignSecret('+i+')">'+esc(p.name)+'</button>').join('')+'</div></div>':'';let secretName=q?.special==='secret'&&state.assignedTo!=null?'<div class="pill">Отвечает: '+esc(state.players[state.assignedTo]?.name)+'</div>':'';let question=q?'<section class="panel question"><div class="pill">'+esc(r.categories[state.active?.c]||'')+' • '+q?.value+' очков '+(q && q?.special!=='normal'?'• '+({flip:'ПЛЮС НА МИНУС',cat:'КОТ В МЕШКЕ',auction:'АУКЦИОН',secret:'СЕКРЕТНЫЙ ВОПРОС',double:'ДВОЙНЫЕ БАЛЛЫ'}[q?.special]||''):'')+'</div>'+secretName+'<div class="question-content '+((!String(q?.text||'').trim()||String(q?.text||'').trim()==='_')&&q?.media&&!(q?.special==='secret'&&state.assignedTo==null)?'image-only':'')+'">'+((q?.special==='secret'&&state.assignedTo==null)?'<h2>🎁 Передай вопрос другому игроку</h2>':((!String(q?.text||'').trim()||String(q?.text||'').trim()==='_')&&q?.media?'':'<h2 class="'+(String(q?.text||'').length>420?'extra-long-question':String(q?.text||'').length>260?'very-long-question':String(q?.text||'').length>145?'long-question':'')+'">'+esc(q?.text||'Вопрос без текста')+'</h2>'))+((q?.special==='secret'&&state.assignedTo==null)?'':mediaHTML(q?.media))+'</div>'+'<div id="clock" class="count">'+state.timerLeft+'</div>'+(state.revealed?'<div class="answer">Ответ: '+esc(q?.answer||'')+'</div>':'')+secretUI+'<div class="flex hostonly" style="justify-content:center"><button class="btn" onclick="timer()">'+(state.timerEnd?'⏸ Пауза':'▶ Таймер')+'</button><button class="btn primary" onclick="reveal()">'+(state.revealed?'Скрыть ответ':'Показать ответ')+'</button><button class="btn" onclick="backToBoard()">← К табло</button></div></section>':'';
let board='<div class="board" style="grid-template-columns:minmax(135px,1.5fr) repeat('+Math.max(1,...r.questions.map(a=>a.length))+',minmax(0,1fr))">'+r.categories.map((cat,c)=>'<div class="cell category" style="display:flex;align-items:center;justify-content:center;text-align:center">'+esc(cat)+'</div>'+Array.from({length:Math.max(...r.questions.map(a=>a.length))},(_,i)=>{let item=r.questions[c]?.[i];return item?'<button class="cell '+(item.used?'used':'')+'" '+(item.used||display?'disabled':'')+' onclick="openQ('+c+','+i+')">'+(item.used?'—':item.value)+'</button>':'<div></div>'}).join('')).join('')+'</div>';
return '<div class="flex space"><div><div class="tag">'+esc(state.title)+'</div><h2>'+esc(r.name)+'</h2></div>'+controls+'</div>'+(q?(specialHTML(q)||question):board)+scores()}
function setRound(n){state.round=n;state.active=null;state.timerEnd=null;state.assignedTo=null;save()}function resetRound(){if(!confirm('Сделать все вопросы раунда снова доступными?'))return;state.rounds[state.round].questions.flat().forEach(q=>q.used=false);state.active=null;state.timerEnd=null;save()}
let editCategory=0,editQuestion=0;
function editor(){
 const r=state.rounds[editIndex];if(!r)return '<div class="notice">Добавь раунд</div>';normalizeGame(state);
 editCategory=Math.max(0,Math.min(editCategory,r.categories.length-1));
 const cats=(r.categories||[]).map((name,c)=>'<button class="editor-category '+(c===editCategory?'selected':'')+'" onclick="editCategory='+c+';editQuestion=0;render()"><span>'+esc(name)+'</span><small>'+((r.questions[c]||[]).filter(q=>String(q?.text||'').trim()).length)+' / '+(r.questions[c]||[]).length+' заполнено</small></button>').join('');
 return '<div class="flex space editor-heading"><div><div class="tag">КОНСТРУКТОР ИГРЫ</div><h2>Редактор вопросов</h2><p class="muted">Выбери раунд, категорию и стоимость. Изменения сохраняются автоматически.</p></div><div class="flex"><button class="btn" onclick="exportGame()">↓ Скачать JSON</button><label class="btn" style="cursor:pointer">↑ Импорт JSON<input type="file" accept=".json,application/json" style="display:none" onchange="importGame(this)"></label></div></div>'+
 '<div class="panel editor-top"><label class="field">Название игры<input value="'+esc(state.title)+'" onchange="state.title=this.value;save()"></label><label class="field">Раунд<select onchange="editIndex=+this.value;editCategory=0;editQuestion=0;render()">'+state.rounds.map((x,i)=>'<option value="'+i+'" '+(i===editIndex?'selected':'')+'>'+esc(x.name)+'</option>').join('')+'</select></label><button class="btn" onclick="addRound()">+ Раунд</button><button class="btn danger small" onclick="deleteRound()">Удалить раунд</button></div>'+
 '<div class="editor-layout"><aside class="panel editor-sidebar"><div class="flex space"><h3>Категории</h3><button class="btn small" onclick="addCategory()">+ Добавить</button></div>'+cats+'</aside><section class="panel editor-main" id="editorBody"></section></div>';
}
function editorBody(){
 const r=state.rounds[editIndex];if(!r)return '';normalizeGame(state);
 const c=editCategory,col=Array.isArray(r.questions?.[c])?r.questions[c]:[],q=col[editQuestion]||col[0];
 if(!q)return '<div class="notice">В этой категории пока нет вопросов.</div>';
 editQuestion=col.indexOf(q);
 const options=[['normal','Обычный вопрос'],['flip','⚡ Плюс на минус'],['secret','🎁 Секретный вопрос'],['modifier','⚡ Модификатор'],['cat','🐈 Кот в мешке'],['auction','🔨 Аукцион'],['double','×2 Двойные баллы']].map(([v,label])=>'<option value="'+v+'" '+(q.special===v?'selected':'')+'>'+label+'</option>').join('');
 const tiles=col.filter(item=>item&&typeof item==='object').map((item,i)=>'<button class="editor-tile '+(i===editQuestion?'selected':'')+'" onclick="editQuestion='+i+';render()"><strong>'+item.value+'</strong><small>'+(['modifier','flip'].includes(item.special)?'⚡':item.special==='secret'?'🎁':item.text.trim()?'✓':'○')+'</small></button>').join('');
 return '<div class="flex space"><div><div class="tag">КАТЕГОРИЯ '+(c+1)+'</div><h3>Настройка категории</h3></div><button class="btn small danger" onclick="deleteCategory('+c+')">Удалить категорию</button></div>'+
 '<label class="field">Название категории<input value="'+esc(r.categories[c])+'" onchange="updateCat('+c+',this.value)"></label>'+
 '<div class="editor-tiles">'+tiles+'</div>'+
 '<div class="editor-form"><div class="flex space"><h3>Вопрос за '+q.value+' баллов</h3><span class="pill">Автосохранение</span></div>'+
 '<div class="formgrid"><label class="field">Стоимость<input type="number" min="0" step="100" value="'+q.value+'" onchange="updateQ('+c+','+editQuestion+',\'value\',+this.value)"></label><label class="field">Механика<select onchange="updateQ('+c+','+editQuestion+',\'special\',this.value)">'+options+'</select></label></div>'+
 '<label class="field">Текст вопроса<textarea rows="4" placeholder="Напиши вопрос, который увидят игроки…" onchange="updateQ('+c+','+editQuestion+',\'text\',this.value)">'+esc(q.text||'')+'</textarea></label>'+
 '<label class="field">Правильный ответ<textarea rows="2" placeholder="Ответ виден ведущему до раскрытия…" onchange="updateQ('+c+','+editQuestion+',\'answer\',this.value)">'+esc(q.answer||'')+'</textarea></label>'+
 '<div class="editor-media"><div class="flex space"><strong>Фото или медиа</strong><button class="btn small" onclick="removeQuestionImage('+c+','+editQuestion+')">Удалить</button></div>'+
 (q.media&&q.media.startsWith('data:image/')?'<img class="editor-preview" src="'+esc(q.media)+'" alt="Превью">':q.media&&/^https?:\/\//.test(q.media)?'<div class="editor-preview-wrap">'+mediaHTML(q.media)+'</div>':'<div class="editor-empty">🖼 Здесь появится изображение к вопросу</div>')+
 '<label class="btn primary editor-upload">📷 Выбрать изображение с ноутбука<input type="file" accept="image/png,image/jpeg,image/webp,image/gif" style="display:none" onchange="uploadQuestionImage('+c+','+editQuestion+',this)"></label>'+
 '<label class="field">Или ссылка на фото / видео / аудио<input placeholder="https://…" value="'+esc((q.media||'').startsWith('data:')?'':q.media||'')+'" onchange="updateQ('+c+','+editQuestion+',\'media\',this.value)"></label></div>'+
 '<div class="flex space editor-bottom"><button class="btn" '+(editQuestion===0?'disabled':'')+' onclick="editQuestion--;render()">← Предыдущий</button><button class="btn primary" '+(editQuestion===col.length-1?'disabled':'')+' onclick="editQuestion++;render()">Следующий →</button></div></div>';
}
async function uploadQuestionImage(c,i,input){let file=input.files?.[0];if(!file)return;if(!['image/png','image/jpeg','image/webp','image/gif'].includes(file.type))return alert('Выбери JPG, PNG, WebP или GIF');if(file.size>12*1024*1024)return alert('Файл слишком большой. Максимум 12 МБ');try{let image=await createImageBitmap(file);let max=1200,ratio=Math.min(1,max/Math.max(image.width,image.height)),canvas=document.createElement('canvas');canvas.width=Math.round(image.width*ratio);canvas.height=Math.round(image.height*ratio);let ctx=canvas.getContext('2d');ctx.drawImage(image,0,0,canvas.width,canvas.height);image.close();let data=canvas.toDataURL('image/jpeg',0.78);let question=state.rounds[editIndex]?.questions[c]?.[i];if(!question)return;let old=question.media;question.media=data;try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){question.media=old;return alert('Не хватает места в браузере. Попробуй файл меньшего размера или ссылку на изображение.')}channel?.postMessage({type:'state',state});render()}catch(e){alert('Не удалось обработать картинку: '+e.message)}}
function removeQuestionImage(c,i){let q=state.rounds[editIndex]?.questions[c]?.[i];if(!q)return;q.media='';save()}
function updateCat(c,v){state.rounds[editIndex].categories[c]=v;save()}function updateQ(c,i,k,v){state.rounds[editIndex].questions[c][i][k]=v;save()}function addCategory(){let r=state.rounds[editIndex];editCategory=r.categories.length;editQuestion=0;r.categories.push('Новая категория');r.questions.push(Array.from({length:5},(_,i)=>({value:(i+1)*100,text:'',answer:'',media:'',special:'normal',used:false})));save()}function deleteCategory(c){let r=state.rounds[editIndex];if(r.categories.length<=1)return alert('Нужна хотя бы одна категория');if(!confirm('Удалить категорию и её вопросы?'))return;r.categories.splice(c,1);r.questions.splice(c,1);editCategory=Math.max(0,Math.min(editCategory,r.categories.length-1));editQuestion=0;save()}function addRound(){let r=starter().rounds[0];r.name='Раунд '+(state.rounds.length+1);r.questions.forEach(col=>col.forEach((q,i)=>{q.value=(i+1)*100*(state.rounds.length+1)}));state.rounds.push(r);editIndex=state.rounds.length-1;editCategory=0;editQuestion=0;save()}function deleteRound(){if(state.rounds.length<=1)return alert('Нужен хотя бы один раунд');if(!confirm('Удалить этот раунд?'))return;state.rounds.splice(editIndex,1);editIndex=0;state.round=0;state.active=null;save()}
function exportGame(){let blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='svoyak-'+Date.now()+'.json';a.click();URL.revokeObjectURL(a.href)}
async function importGame(input){let file=input.files[0];if(!file)return;try{let obj=JSON.parse(await file.text());if(!Array.isArray(obj.rounds)||!Array.isArray(obj.players)||!obj.rounds.every(r=>Array.isArray(r.categories)&&Array.isArray(r.questions)))throw Error('Неверная структура');if(!confirm('Заменить текущую игру импортированной?'))return;state=normalizeGame({...starter(),...obj,active:null,timerEnd:null});editIndex=0;save()}catch(e){alert('Ошибка импорта: '+e.message)}}
function settings(){return '<h2>Настройки игры</h2><div class="panel"><label class="field">Таймер вопроса (секунд)<input type="number" min="5" max="300" value="'+state.seconds+'" onchange="state.seconds=Math.max(5,+this.value||30);state.timerLeft=state.seconds;save()"></label><div class="flex" style="margin-top:20px"><button class="btn danger" onclick="resetScores()">Обнулить очки</button><button class="btn danger" onclick="resetAll()">Новая игра с примером</button><button class="btn primary" onclick="openDisplay()">Открыть экран игроков</button></div><p class="muted">Для показа на телевизоре перетащите окно «Экран игроков» на второй монитор и включите полноэкранный режим (F11). Оба окна синхронизируются в одном браузере. Ведущий видит ответы в редакторе, а игроки — только вопрос и открытый ответ.</p></div>'}
function resetScores(){if(!confirm('Обнулить очки всех игроков?'))return;state.players.forEach(p=>p.score=0);save()}function resetAll(){if(!confirm('Заменить игру примером? Сначала экспортируйте текущую игру.'))return;state=starter();editIndex=0;save()}
function render(){let el=document.getElementById('app');try{el.innerHTML=display?game():tab==='game'?game():tab==='editor'?editor():settings();if(tab==='editor'&&!display)document.getElementById('editorBody').innerHTML=editorBody()}catch(e){console.error('СВОЯК render error',e);el.innerHTML='<div class="panel"><h2>Ошибка отображения</h2><p>'+esc(e.message)+'</p><button class="btn" onclick="state.active=null;state.revealed=false;save()">Вернуться к табло</button></div>'}}
setInterval(()=>{if(!state.timerEnd)return;let left=Math.max(0,Math.ceil((state.timerEnd-Date.now())/1000));let el=document.getElementById('clock');if(el)el.textContent=left;if(left===0){state.timerEnd=null;state.timerLeft=0;save()}},250);render();
</script></body></html>
